line_follower_node:
  ros__parameters:
    image_topic: /camera/image_raw
    cmd_vel_topic: /cmd_vel
    servo_topic: /servo_cmd

    image_width: 640
    image_height: 480

    # Three horizontal regions of interest: [y1, y2, x1, x2, weight]
    # The bottom ROI has the highest weight because it is closest to the robot.
    roi_1: [120.0, 140.0, 0.0, 320.0, 0.10]
    roi_2: [160.0, 185.0, 0.0, 320.0, 0.30]
    roi_3: [200.0, 235.0, 0.0, 320.0, 0.60]

    # Yellow threshold in OpenCV HSV. Tune this with /line_follower/mask.
    h_min: 18
    s_min: 70
    v_min: 70
    h_max: 45
    s_max: 255
    v_max: 255

    min_contour_area: 150.0
    morph_kernel_size: 5

    # Start conservative. Increase base_speed after it follows reliably.
    base_speed: 0.08
    kp_angular: 0.90
    max_angular_speed: 0.75
    angular_sign: -1.0
    slowdown_on_error: 0.45
    lost_line_timeout: 0.25
    search_when_lost: false
    search_angular_speed: 0.25

    # Camera servo pose. For your current package, tilt_channel is 3 and default_tilt is 500.
    set_camera_servo: true
    servo_pan: 1500
    servo_tilt: 500
    servo_init_duration: 3.0
    servo_publish_period: 0.5

    publish_debug: true
    show_debug_window: false
    log_every_n_frames: 10
