line_follower_node:
  ros__parameters:
    image_topic: /camera/image_gray
    cmd_vel_topic: /cmd_vel
    debug_image_topic: /line_follower/debug_image
    mask_topic: /line_follower/mask
    status_topic: /line_follower/status
    publish_debug: true
    debug_publish_rate: 3.0

    detection_mode: brightness

    brightness_threshold: 180
    blur_kernel: 5
    morph_kernel: 5

    h_min: 18
    s_min: 70
    v_min: 70
    h_max: 45
    s_max: 255
    v_max: 255

    roi_1: [135.0, 220.0, 210.0, 430.0, 0.45]
    roi_2: [220.0, 310.0, 200.0, 440.0, 0.40]
    roi_3: [310.0, 350.0, 230.0, 410.0, 0.15]

    base_speed: 0.13

    kp_angular: 0.80
    ki_angular: 0.00
    kd_angular: 0.05

    min_linear_speed: 0.13
    max_linear_speed: 0.13

    min_angular_speed: 0.00
    max_angular_speed: 0.55

    angular_sign: 1.0
    slowdown_on_error: 0.00
    deadband_error: 0.04
    integral_limit: 0.00

    use_center_filter: true
    center_smoothing_alpha: 0.30
    max_center_jump_px: 50.0
    low_confidence_weight_threshold: 0.70
    low_confidence_angular_scale: 0.65

    min_contour_area: 40.0
    search_when_lost: false
    search_angular_speed: 0.40

line_follower_pose_node:
  ros__parameters:
    enable_pose_init: true
    move_time_ms: 1000
    use_deviation: true

    servo_1: 1200
    servo_3: 500
    servo_4: 2265
    servo_5: 1150
    servo_6: 1500
